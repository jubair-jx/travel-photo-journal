name: CI

on:
  push:
    branches: [main]
  pull_request:

# The workflow only reads the repository; nothing here needs write access.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (format, lint, types, tests, build, audit)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tpj
          POSTGRES_PASSWORD: tpj
          POSTGRES_DB: tpj_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tpj"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL_TEST: postgresql://tpj:tpj@localhost:5432/tpj_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Lint and typecheck need the generated Prisma client, which is not committed.
      - run: npm run prisma:generate -w backend
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high

  images:
    name: Docker images build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # Built, not pushed: this proves the Dockerfiles work on every change.
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: false
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          build-args: API_INTERNAL_URL=http://api:4000
          push: false
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
