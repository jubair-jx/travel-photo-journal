services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tpj
      POSTGRES_PASSWORD: tpj
      POSTGRES_DB: tpj_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tpj -d tpj_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
